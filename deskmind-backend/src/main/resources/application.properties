spring.application.name=deskmind-backend

# Usando chaves limpas para o Spring ler
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# Serviço py mockado
ai.service.url=http://localhost:8001
ai.analyzer.provider=http
ai.service.connect-timeout-ms=5000
ai.service.read-timeout-ms=30000
